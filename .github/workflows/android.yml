name: Android APK

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check release tag
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          values = dict(
              line.split('=', 1)
              for line in Path('app/version.properties').read_text().splitlines()
              if '=' in line and not line.startswith('#')
          )
          expected = f"v{int(values['VERSION_MAJOR'])}.{int(values['VERSION_CODE']):04d}"
          actual = os.environ['GITHUB_REF_NAME']
          if actual != expected:
              raise SystemExit(f'Tag {actual} does not match app version {expected}')
          print(f'Building {expected} (code {values["VERSION_CODE"]})')
          PY

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Verify APK version and filename
        id: verify
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          values = dict(
              line.split('=', 1)
              for line in Path('app/version.properties').read_text().splitlines()
              if '=' in line and not line.startswith('#')
          )
          code = int(values['VERSION_CODE'])
          name = f"{int(values['VERSION_MAJOR'])}.{code:04d}"
          output_dir = Path('app/build/outputs/apk/debug')
          metadata = json.loads((output_dir / 'output-metadata.json').read_text())
          element, = metadata['elements']
          expected_file = f'loopmuse-{name}-c{code}-debug.apk'
          if (element['versionCode'], element['versionName'], element['outputFile']) != (code, name, expected_file):
              raise SystemExit(f'APK metadata does not match {name} (code {code}): {element}')
          if not (output_dir / expected_file).is_file():
              raise SystemExit(f'APK is missing: {expected_file}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'artifact_name={expected_file.removesuffix(".apk")}\n')
          print(f'Verified {expected_file}: versionName={name}, versionCode={code}')
          PY
          git diff --exit-code -- app/version.properties

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.verify.outputs.artifact_name }}
          path: app/build/outputs/apk/debug/loopmuse-*.apk
          if-no-files-found: error
