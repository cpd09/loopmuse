plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.parcelize'
    id 'com.google.gms.google-services'
    id 'com.google.devtools.ksp'
}

def versionPropsFile = file('version.properties')
Properties versionProps = new Properties()
if (!versionPropsFile.isFile()) {
    throw new GradleException('app/version.properties is missing')
}
versionPropsFile.withInputStream { versionProps.load(it) }

if (!versionProps['VERSION_MAJOR'] || !versionProps['VERSION_CODE']) {
    throw new GradleException('VERSION_MAJOR and VERSION_CODE are required in app/version.properties')
}
def versionMajor = versionProps['VERSION_MAJOR'].toInteger()
def currentVersionCode = versionProps['VERSION_CODE'].toInteger()
if (versionMajor < 1 || currentVersionCode < 1) {
    throw new GradleException('VERSION_MAJOR and VERSION_CODE must be positive integers')
}
def currentVersionName = String.format('%d.%04d', versionMajor, currentVersionCode)

android {
    namespace 'com.example.loopmuse'

    compileSdk 35

    defaultConfig {
        applicationId "com.example.loopmuse"
        minSdk 24
        targetSdk 35
        versionCode currentVersionCode
        versionName currentVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        disable 'GradleDependency', 'NewerVersionAvailable', 'OldTargetApi'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "loopmuse-${variant.versionName}-c${variant.versionCode}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.activity:activity-compose:1.10.0'

    // BOM 버전을 최신으로 업데이트
    implementation platform('androidx.compose:compose-bom:2025.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // Material 3 테마 지원을 위한 추가 의존성
    implementation 'com.google.android.material:material:1.12.0'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'

    // Room Database
    def room_version = "2.8.5"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // Permissions
    implementation 'com.google.accompanist:accompanist-permissions:0.37.0'
    
    // JSON Serialization
    implementation 'com.google.code.gson:gson:2.12.1'
    
    // Media Support
    implementation 'androidx.media:media:1.7.0'
    
    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.8.0')
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
